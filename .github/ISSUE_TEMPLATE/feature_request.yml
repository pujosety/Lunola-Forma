name: Feature Request
description: Describe a user need and a proposed improvement.
title: '[Feature]: '
body:
- type: markdown
  attributes:
    value: Report Lunola Forma behavior for your actual build. The engine base is 5.4.0 Alpha; no public
      binary release is available yet. Read the [privacy/reporting guide](https://github.com/pujosety/Lunola-Forma/blob/main/docs/lunola/ISSUE_REPORTING.md).
      This is a public issue. Logs and attachments are optional, manually supplied, and never collected
      or uploaded automatically. Remove secrets, personal paths and private assets before posting. Security
      concerns belong in SECURITY.md, not public issues.
- type: textarea
  id: version
  attributes:
    label: Lunola Forma version and build
    description: 'Copy the actual About or --version output, including engine version (current base: 5.4.0
      Alpha) and build/commit identifier if available. Say Unknown if unavailable. Do not invent a release
      number.'
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: Operating system
    description: OS version and architecture; omit account names and machine identifiers.
  validations:
    required: true
- type: textarea
  id: gpu_driver
  attributes:
    label: GPU, driver and backend
    description: GPU model, driver version, and graphics/render backend when relevant. Use Unknown or
      Not applicable rather than guessing.
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: User need
    description: Describe the problem and who encounters it.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Current workflow / concrete example
    description: Give steps showing the current limitation. Mark hypothetical examples explicitly.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Proposed behavior
    description: Describe the desired outcome and scope.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Current behavior and alternatives
    description: Explain the actual current behavior and workarounds you tried; do not present an untested
      feature as existing.
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Optional reviewed logs / evidence
    description: 'Optional: paste a short manually reviewed, redacted excerpt. Attachments are optional.
      Remove credentials, personal paths, private content and packed assets. You may leave this empty.'
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Public-report privacy check
    options:
    - label: I reviewed the text and any optional attachments for secrets, personal information and private
        assets. I understand this is a public report and no local data is collected automatically.
      required: true
